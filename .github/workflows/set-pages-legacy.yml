name: Set Pages Legacy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages to branch build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/chenhuanet/19century/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/chenhuanet/19century/pages/builds"
